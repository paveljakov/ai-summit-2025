[tool.poetry]
name = "aisummit-cli"
version = "0.1.0"
description = "LLM-powered CLI tool for AI Summit 2025 demo - a meta-demonstration of building LLM CLI applications"
authors = ["Pavel Jakovlev <pavel.jakovlev@example.com>"]
readme = "README.md"
packages = [{include = "aisummit_cli", from = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
pydantic-ai = "^1.20.0"
textual = "^6.6.0"
rich = "^14.2.0"
anthropic = "^0.74.1"  # For Claude integration
gitpython = "^3.1.45"  # For git operations
python-dotenv = "^1.2.1"
langfuse = "^3.9.0"
qrcode = "^8.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.1"
pytest-asyncio = "^1.3.0"
black = "^25.11.0"
ruff = "^0.14.5"
mypy = "^1.18.2"
ipython = "^9.7.0"
textual-dev = "^1.8.0"
debugpy = "^1.8.17"
pydevd-pycharm = "^253.28294.166"

[tool.poetry.scripts]
aisummit = "aisummit_cli.main:main"
aisummit-dev = "aisummit_cli.main:dev_main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py313']

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
